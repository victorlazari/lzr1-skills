<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NemoClaw Secure Credential Form</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>NemoClaw Secure Credential Form</h1>
    <form id="credentialForm">
        <div class="form-group">
            <label for="provider">Provider:</label>
            <input type="text" id="provider" name="provider" required>
        </div>
        <div class="form-group">
            <label for="apiKey">API Key:</label>
            <input type="password" id="apiKey" name="apiKey" required>
        </div>
        <button type="submit">Save Credentials</button>
    </form>
    <script>
        document.getElementById('credentialForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const provider = document.getElementById('provider').value;
            const apiKey = document.getElementById('apiKey').value;
            console.log(`Credentials for ${provider} saved securely (simulated).`);
            alert('Credentials saved securely.');
        });
    </script>
</body>
</html>
