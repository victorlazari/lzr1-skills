# OoklaServer.properties
# Reusable configuration template with secure defaults, log rotation, and connection limits.

# Server Port Configuration
# Ensure UDP 8080 and 5060 are open in the firewall for UDP latency support
OoklaServer.tcpPorts = 8080
OoklaServer.udpPorts = 8080,5060

# Security and TLS Configuration
# Requires OpenSSL 3.5.5+
OoklaServer.useTLS = true
OoklaServer.tlsCertificateFile = /etc/ssl/certs/ooklaserver.crt
OoklaServer.tlsKeyFile = /etc/ssl/private/ooklaserver.key

# Security Headers
OoklaServer.enableHSTS = true
OoklaServer.xFrameOptions = DENY

# Connection Limits to mitigate abuse
OoklaServer.maxConnections = 10000
OoklaServer.maxConnectionsPerIP = 50

# Logging Configuration
OoklaServer.logLevel = INFO
OoklaServer.logFile = /var/log/ooklaserver/ooklaserver.log

# Log Rotation (Internal rotation settings if supported, otherwise use logrotate)
OoklaServer.logMaxSizeBytes = 10485760 # 10 MB
OoklaServer.logMaxFiles = 5

# Allowed Domains (CORS)
OoklaServer.allowedDomains = *.speedtest.net, *.ookla.com
