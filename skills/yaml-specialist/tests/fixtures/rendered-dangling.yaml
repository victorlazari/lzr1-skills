apiVersion: v1
kind: Pod
metadata:
  name: dangling-secret
  namespace: tests
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.example.invalid/example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: externally-managed-secret
              key: api-token
