apiVersion: v1
kind: ServiceAccount
metadata:
  name: fixture
  namespace: tests
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fixture
  namespace: tests
data:
  mode: portable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
  namespace: tests
spec:
  selector:
    matchLabels:
      app: fixture
  template:
    metadata:
      labels:
        app: fixture
    spec:
      serviceAccountName: fixture
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.example.invalid/example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: fixture
                  key: mode
