# Minimal Trivy configuration baseline.
# Verified against the official v0.73.0 example and current config reference: 2026-08-07.
# Re-validate with `trivy --config ./trivy.yaml config` or the current documented
# equivalent before production use; configuration keys can change across releases.
#
# Security intent:
# - JSON is the canonical local evidence format.
# - Discovery does not fail only because findings exist; use a separate policy gate.
# - All four scanners are selected explicitly.
# - No directories/files are skipped and no ignore file is loaded by this template.
# - The caller must choose an explicit target and output path.

# Global/report options supported by the official v0.73.0 example.
timeout: 10m
format: json
dependency-tree: false
list-all-pkgs: true
exit-code: 0
severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

scan:
  scanners:
    - vuln
    - misconfig
    - secret
    - license
  skip-dirs: []
  skip-files: []

vulnerability:
  type:
    - os
    - library
  ignore-unfixed: false

# Do not add `ignorefile` until the file is independently reviewed, tested with
# the installed release, and reconciled with an approved governance ledger.
# YAML ignore support was documented as experimental on 2026-08-07 and must be
# selected explicitly where required by the installed release.

# Database updates, offline mode, cache location, registry credentials, server
# address, custom checks, modules, plugins, and output paths are intentionally
# absent. Set them explicitly for the execution environment and record them in
# the evidence manifest. CLI flags override this file.
