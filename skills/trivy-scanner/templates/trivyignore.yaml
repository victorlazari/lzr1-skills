# Review-only .trivyignore.yaml starting point.
# Upstream filtering documentation verified: 2026-08-07.
# https://trivy.dev/docs/latest/configuration/filtering/
#
# IMPORTANT:
# - YAML ignore support was documented as EXPERIMENTAL and potentially
#   backward-incompatible at the verification date.
# - Select this file explicitly with `--ignorefile` where required by the
#   installed release.
# - Test parsing and positive/negative suppression behavior before merge.
# - Keep owner, evidence, approval, and audit state in a separate protected
#   governance ledger; those are not Trivy schema fields.
# - A suppression does not remove the underlying condition.
#
# Supported entry fields at the verification date:
#   id          required string
#   paths       optional string array
#   purls       optional string array; vulnerabilities only
#   expired_at  optional YYYY-MM-DD date
#   statement   optional rationale; not used by Trivy's filter decision
#
# Example (leave commented until reviewed):
# vulnerabilities:
#   - id: "CVE-2025-12345"
#     paths:
#       - "package-lock.json"
#     purls:
#       - "pkg:npm/example@1.2.3"
#     expired_at: 2026-12-31
#     statement: "SEC-1234: bounded exception while the upgrade is validated"
#
# Do NOT add unsupported keys such as `reason`, `owner`, `evidence`, `ticket`,
# `approved_by`, `expires`, or `scope` to this file.

vulnerabilities: []
misconfigurations: []
secrets: []
licenses: []
