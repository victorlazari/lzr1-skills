# Review-only Trivy secret-scanner configuration.
# Verified against upstream secret-scanner documentation: 2026-08-07.
# https://trivy.dev/docs/latest/scanner/secret/
#
# CAUTION: Trivy attempts to load `trivy-secret.yaml` from its current working
# directory automatically. Prefer an explicit, reviewed path with
# `--secret-config` and record the file digest in scan evidence.
#
# This baseline enables no custom rules and no custom allow rules. Trivy's
# built-in rules remain active unless `enable-builtin-rules` or `disable-rules`
# is set. Test all changes on positive and negative fixtures before merge.

rules: []
allow-rules: []

# Narrow custom-rule example (leave commented until adapted and tested):
# rules:
#   - id: organization-service-token
#     category: organization
#     title: Organization service token
#     severity: HIGH
#     path: '(?i)\.(?:env|json|ya?ml|toml)$'
#     keywords:
#       - organization_service_token
#       - organization-service-token
#     regex: '(?i)(organization[_-]?service[_-]?token)\s*[:=]\s*["'"']?([A-Za-z0-9_-]{32,})'
#
# Supported rule fields at the verification date:
#   id, category, title, severity, regex (required)
#   path, keywords, allow-rules (optional)
# Trivy uses Go regular-expression syntax. Use `(?m)` when ^/$ must match lines.
#
# Narrow allow-rule example (leave commented until evidence-backed):
# allow-rules:
#   - id: exact-generated-placeholder
#     description: Exact non-secret placeholder emitted by the project generator
#     regex: '^ORGANIZATION_SERVICE_TOKEN=EXAMPLE_NOT_A_SECRET$'
#
# An allow rule requires `regex` or `path`. Do not broadly exempt test trees,
# documentation, fixtures, extensions, or lock files: real credentials frequently
# leak there. Prefer exact known-nonsecret text or a narrowly anchored path, and
# keep owner, ticket, approval, expiry, fixtures, and review evidence outside this
# parser-facing file.
#
# Do not set both `enable-builtin-rules` and `disable-rules`; if both exist,
# `disable-rules` takes precedence. Treat any change to built-in rule coverage as
# a reviewed policy change and preserve coverage tests.
