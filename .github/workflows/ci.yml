name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Lint catalog
        run: python3 -I scripts/lint_catalog.py
      - name: Catalog linter tests
        run: bash tests/test-catalog.sh
      - name: Script smoke tests
        run: bash tests/test-scripts.sh
      # yaml-specialist never installs its pinned dependencies itself, so the
      # installed-skill self-check needs them in an isolated venv. shellcheck
      # and jq are preinstalled on ubuntu runners. PyYAML is used by the
      # compose check in tests/test-adversarial-remediations.sh.
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Install reviewed yaml-specialist pins
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-virtualenv -r skills/yaml-specialist/scripts/requirements.txt PyYAML==6.0.2
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Ruff (E9,F) on skills
        if: runner.os == 'Linux'
        run: |
          "$RUNNER_TEMP/venv/bin/pip" install --require-virtualenv ruff==0.8.6
          "$RUNNER_TEMP/venv/bin/ruff" check --select E9,F skills
      - name: Compile skill Python
        if: runner.os == 'Linux'
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -I -m compileall -q skills
      - name: Installer tests
        run: bash -x tests/test-installer.sh 2>&1 | tail -60; exit ${PIPESTATUS[0]}
      - name: Adversarial remediation tests
        run: bash tests/test-adversarial-remediations.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Shellcheck installer and tests
        run: shellcheck --severity=warning -x install.sh tests/*.sh
      - name: Shellcheck skill scripts
        run: |
          shopt -s nullglob
          files=(skills/*/scripts/*.sh)
          if [ "${#files[@]}" -gt 0 ]; then shellcheck --severity=warning -x "${files[@]}"; fi
