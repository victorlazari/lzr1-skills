name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Lint catalog
        run: python3 -I scripts/lint_catalog.py
      - name: Catalog linter tests
        run: bash tests/test-catalog.sh
      - name: Installer tests
        run: bash tests/test-installer.sh
      - name: Adversarial remediation tests
        run: bash tests/test-adversarial-remediations.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Shellcheck installer and tests
        run: shellcheck -x install.sh tests/*.sh
      - name: Shellcheck skill scripts (informational)
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(skills/*/scripts/*.sh)
          if [ "${#files[@]}" -gt 0 ]; then shellcheck -x "${files[@]}"; fi
